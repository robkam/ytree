# Preset: de
# Locale/layout: German mnemonic preset for the packaged command surfaces.
# This is packaged read-only command-preset data selected from commands.conf.
# Action IDs are internal identifiers and must not be translated.
[DIR]
A | A | Attribute | ACTION_CMD_A |
K | K | Kopieren | ACTION_CMD_C |
D | D | Datei loeschen | ACTION_CMD_D |
F | F | Filter | ACTION_FILTER |
G | G | Global | ACTION_CMD_G |
I | I | Invertieren | ACTION_INVERT |
J | J | Vergleich | ACTION_COMPARE_DIR |
L | L | Logbuch | ACTION_LOG |
M | M | Neuer Ordner | ACTION_CMD_M |
N | N | Neue Datei | ACTION_CMD_MKFILE |
O | O | Nur markierte | ACTION_TOGGLE_TAGGED_MODE |
P | P | Pipe | ACTION_CMD_P |
Q | Q | Beenden | ACTION_QUIT |
R | R | Umbenennen | ACTION_CMD_R |
S | S | Showall | ACTION_CMD_S |
T | T | Markieren | ACTION_TAG |
U | U | Entmarkieren | ACTION_UNTAG |
V | V | Verschieben | ACTION_CMD_V |
W | W | Schreiben | ACTION_CMD_PRINT |
X | X | eXecute | ACTION_CMD_X |
Z | Z | Archiv | ACTION_CMD_I |
/ | / | Sprung | ACTION_LIST_JUMP |
` | ` | Punktdateien | ACTION_TOGGLE_HIDDEN |


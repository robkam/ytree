# Alternative YtreeNova command layout: en
#
# This file defines the named "en" command preset.
# It is an alternative to the default layout in etc/ytnova.commands.
#
# YtreeNova uses this file only if the user selects:
#   preset = en
# in commands.conf.
#
# Edit this file to change the "en" preset.
# Edit etc/ytnova.commands to change the default shipped layout.
#
# This file changes the real command layout:
# key bindings, footer labels, actions, and optional custom commands.
# Action IDs are internal identifiers and must not be translated.
[DIR]
A | A | Attributes | ACTION_CMD_A |
C | C | Copy | ACTION_CMD_C |
D | D | Delete | ACTION_CMD_D |
F | F | Filter | ACTION_FILTER |
G | G | Global | ACTION_CMD_G |
I | I | Invert | ACTION_INVERT |
J | J | Compare | ACTION_COMPARE_DIR |
L | L | Log | ACTION_LOG |
M | M | Makedir | ACTION_CMD_M |
N | N | Newfile | ACTION_CMD_MKFILE |
P | P | Pipe | ACTION_CMD_P |
Q | Q | Quit | ACTION_QUIT |
R | R | Rename | ACTION_CMD_R |
S | S | Showall | ACTION_CMD_S |
T | T | Tag | ACTION_TAG |
U | U | Untag | ACTION_UNTAG |
V | V | Movedir | ACTION_CMD_V |
O | O | Output | ACTION_CMD_PRINT |
X | X | Execute | ACTION_CMD_X |
Z | Z | Archive | ACTION_CMD_I |
/ | / | Jump | ACTION_LIST_JUMP |
` | ` | Dotfiles | ACTION_TOGGLE_HIDDEN |


###############################################
# YtreeNova Defaults
# Built-in default profile template for ~/.config/ytnova/ytnova.conf.
# If the XDG config path cannot be used, ytnova falls back to ~/.ytnova.
# F10 Config and `ytnova --init` can write it for you.
# You may also invoke it explicitly with the
# "-p <profile-filename> command line argument.
###############################################

[GLOBAL]
# AUTO_REFRESH: Add values to combine modes.
# 1 Enable File System Watcher.
# 2 Refresh on Directory Navigation selection.
# 4 Refresh when entering the File Window.
AUTO_REFRESH=3
TREEDEPTH=2
FILEMODE=2
SMALLWINDOWSKIP=1
VI_KEYS=0
AUDIBLEERROR=1
# CONFIRMQUIT=0 # probably redundant

# VI_KEYS note:
#   Runtime profile setting (0=off, 1=on).
#   When enabled, h/j/k/l and Ctrl-D/Ctrl-U are reserved for navigation.
#   Colliding commands move to uppercase (H/J/K/L, plus file-view D/U).

# HIGHLIGHT_FULL_LINE: Set to 1 to highlight the entire line for the selected
# entry. Set to 0 for the classic behavior, which highlights only the filename.
HIGHLIGHT_FULL_LINE=0

# HIDEDOTFILES: Set to 1 to hide files and directories starting with a dot by
# default. Set to 0 to show them. This can be toggled with the ` key.
HIDEDOTFILES=1

# ANIMATION: Set to 1 to enable the warp-speed starfield animation
# during directory scanning. Set to 0 for the classic static logo.
ANIMATION=0

#LISTJUMP search: 0== standard (one key); 1==incremental
# LISTJUMPSEARCH=0 # redundant
# SEARCHCOMMAND=grep  {} # redundant

# Configure if the internal HEX-Viewer/Editor should display
# Adress-Offsets in hex (HEX) or decimal (DECIMAL)
HEXEDITOFFSET=HEX

# Make YtreeNova start in file window mode, in a specified directory
# The "root" directory for YtreeNova is specified on the command
# line; INITIALDIR must be a directory under this root directory.
# The form may be ".", "/full/path/userhome/test/alpha/beta",
# "./alpha/beta", "~/test/alpha/beta", or "beta"
# INITIALDIR=./alpha/beta

# You can create a custom view by defining the variable USERVIEW

# %tag: Tag-Symbol
# %fnm: Filename
# %atr: Attributes
# %lct: Link-Count
# %fsz: File-Size
# %mot: Modification Time
# %lnm: Symbolik Link-Name
# %uid: User-ID
# %gid: Group-ID
# %ino: Inode
# %act: Access Time
# %sct: Status Change Time

# USERVIEW=%tag%fnm %atr %lct %fsz %mot

# Uncomment the following lines to customize external helper programs.
# CAT=cat # redundant
EDITOR=vim
# FILEDIFF controls the file compare helper.
# Supports placeholders %1 (source) and %2 (target); if omitted, ytnova appends
# source and target paths as arguments.
# FILEDIFF=diff -u
# DIRDIFF controls the external directory compare helper.
# DIRDIFF=diff -ru
# TREEDIFF controls the external tree compare helper.
# Leave empty to reuse DIRDIFF behavior by default.
# TREEDIFF=
# HEXDUMP=builtin # redundant
# MANROFF=nroff -man # redundant
# MELD=meld # redundant
# PAGER=less -cen
# TAGGEDVIEWER controls `^V` (View Tagged) mode:
#   external = use PAGER (default, less-style behavior)
#   internal = use YtreeNova internal tagged viewer (space/n/p handling in YtreeNova)
TAGGEDVIEWER=internal

# THEME checks ~/.config/ytnova/themes.conf first, then the home fallback
# ~/.ytnova.themes only when the XDG target path is unavailable.
# Missing user theme catalogs are satisfied from packaged/compiled defaults without
# creating a user file, only --init / explicit F10 edit flows create starter files.
# Edit semantic roles and file-type palette rules there.
# Built-in starter themes (leave one uncommented):
THEME=classic-blue
# THEME=orthodox-blue
# THEME=bash-black

[VIEWER]
.jpg,.gif,.bmp,.tif,.ppm,.xpm=xv -
.1,.2,.3,.4,.5,.6,.7,.8,.n=nroff -man - | less
.ps=ghostview
.mid=timidity -id
.wav=splay
.au=auplay
.avi,.mpg,.mov=xanim
.htm,.html=lynx
.pdf,.PDF=okular
.mp3=mpg123

######################################
# The values DIR1, DIR2, FILE1, and FILE2 in the [MENU] section redefine the text
# presented in menu lines 1 and 2 of the DIR and FILE windows, respectively.  The
# mapping of the keyboard is not changed here, just the text presented to the user.
######################################

[MENU]
# DIR1=DIR-CUST  (A)ttribute (B)->a (D)elete  (F)ilespec (G)roup (k)-du (K)-dirpath (L)og (Q)uit
# DIR2=COMMANDS  (M)akedir (O)wner (P)ath/owner (R)ename (S)howall (T)ag (U)ntag e(X)ecute   (^F) dirmode
# FILE1=FILE-CUST (A)ttribute (C)opy (D)elete (E)dit (F)ilespec (G)cc (H)ex (I)nvert (L)og (M)ove (Q)uit
# FILE2=COMMANDS  (O)wner (P)ipe (R)ename (S)ort (T)ag (U)ntag (V)iew (W)c e(X)ecute pathcop(Y) (^F)ilemode

######################################
# The [DIRMAP] and [FILEMAP] sections allow keyboard keys to be remapped or unmapped
# in directory mode and file mode, respectively.  The comma-separated list of keys to
# the left of the "=" is remapped to perform the action specified by the character to
# the right of the "=".  If no character is specified, the keys are unmapped (do nothing).
######################################
[DIRMAP]
# <B> or <b> in dir window mode is remapped to <a> key action (Attribute)
# B,b=a
# <P> or <p> in dir window mode is remapped to <o> key action (Owner)
# P,p=o

[FILEMAP]
# <I> in file window mode is remapped to <v> key action (View)
# i,I=v
# <G> in file window mode is remapped to <g>
# G=g
# YtreeNova default assignment of <g> to "group" is removed
# g=

######################################
# The [DIRCMD] and [FILECMD] sections allow new command actions to be defined
# in directory mode and file mode, respectively.  The command to the right of
# the "=" is executed when the key to the right of the "=" is pressed.  If the
# key is mapped (either by the default YtreeNova key assignments or by a [DIRMAP]
# or [FILEMAP] entry,) this mapping is followed after the command is executed.
# Thus to change FILE mode "g" from "group" to "gcc" requires both a FILECMD
# assignment "g=gcc -O -c" and a FILEMAP assignment "g=" (to remove the default
# action "group" from the "g" key.)
#
# If [command] contains the characters "%s", the selected <filepath> is
# substituted for "%s".  Otherwise, the selected <filepath> is appended to [command].
######################################
[DIRCMD]
# <k> in dir window mode does "du <dirname> | less"
# k=du %s | less
# <K> in dir window mode does "echo <dirname> | less"
# K=echo %s | less
# <p> in dir window mode does "echo <dirname> | less"
# p=echo %s | less

[FILECMD]
# <g>  in file window mode does "gcc -O -c <filename>"
# g=gcc -O -c
# <w>  in file window mode does "wc <filename> | less"
# w=wc %s | less

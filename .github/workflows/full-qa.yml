name: C/C++ Full QA

on:
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-qa-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect full-QA relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      qa_relevant: ${{ steps.force.outputs.qa_relevant || steps.filter.outputs.qa_relevant }}
    steps:
    - name: Force full QA for manual dispatch
      id: force
      if: github.event_name == 'workflow_dispatch'
      run: echo "qa_relevant=true" >> "$GITHUB_OUTPUT"

    - name: Detect PR file changes
      id: filter
      if: github.event_name == 'pull_request'
      uses: dorny/paths-filter@v4
      with:
        filters: |
          qa_relevant:
            - 'src/**'
            - 'include/**'
            - 'tests/**'
            - 'scripts/**'
            - 'Makefile'
            - '.github/workflows/**'

  guard-and-code-quality:
    name: Guard and code-quality gate
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.qa_relevant == 'true'
    timeout-minutes: 30
    env:
      CC: ccache cc
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache libncurses-dev libtinfo-dev libreadline-dev libarchive-dev libarchive-tools cmark

    - name: Restore ccache
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/.ccache
        key: ${{ runner.os }}-ccache-${{ github.workflow }}-code-quality-${{ hashFiles('Makefile', '.github/workflows/full-qa.yml') }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ github.workflow }}-code-quality-
          ${{ runner.os }}-ccache-${{ github.workflow }}-

    - name: Set up Python 3
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: scripts/requirements.txt

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r scripts/requirements.txt

    - name: Configure compiler cache
      run: |
        ccache --set-config=max_size=900M
        ccache --set-config=sloppiness=time_macros
        ccache --zero-stats

    - name: Guard fuzz harness sync
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PUSH_BASE_SHA: ${{ github.event.before }}
        PUSH_HEAD_SHA: ${{ github.sha }}
      run: |
        set -eu
        if [ "$EVENT_NAME" = "pull_request" ]; then
          BASE_SHA="$PR_BASE_SHA"
          HEAD_SHA="$PR_HEAD_SHA"
        else
          BASE_SHA="$PUSH_BASE_SHA"
          HEAD_SHA="$PUSH_HEAD_SHA"
        fi
        python3 scripts/check_fuzz_harness_sync.py --base "$BASE_SHA" --head "$HEAD_SHA"

    - name: Run guard and code-quality gate
      run: |
        set -euo pipefail
        make qa-code-quality 2>&1 | tee qa-code-quality.log

    - name: Upload code-quality log artifact
      if: always() && hashFiles('qa-code-quality.log') != ''
      uses: actions/upload-artifact@v7
      with:
        name: qa-code-quality-log
        path: qa-code-quality.log

    - name: Report ccache stats
      if: always()
      run: ccache --show-stats

  static-analysis:
    name: Static analyzer gate
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.qa_relevant == 'true'
    timeout-minutes: 90
    env:
      CC: ccache cc
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache libncurses-dev libtinfo-dev libreadline-dev libarchive-dev libarchive-tools cmark clang-tidy cppcheck clang-tools bear

    - name: Restore ccache
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/.ccache
        key: ${{ runner.os }}-ccache-${{ github.workflow }}-static-analysis-${{ hashFiles('Makefile', '.github/workflows/full-qa.yml') }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ github.workflow }}-static-analysis-
          ${{ runner.os }}-ccache-${{ github.workflow }}-

    - name: Configure compiler cache
      run: |
        ccache --set-config=max_size=900M
        ccache --set-config=sloppiness=time_macros
        ccache --zero-stats

    - name: Run static analyzer gate
      run: |
        set -euo pipefail
        {
          make qa-clang
          make qa-cppcheck
          make qa-scan
        } 2>&1 | tee qa-static-analysis.log

    - name: Upload static analyzer log artifact
      if: always() && hashFiles('qa-static-analysis.log') != ''
      uses: actions/upload-artifact@v7
      with:
        name: qa-static-analysis-log
        path: qa-static-analysis.log

    - name: Report ccache stats
      if: always()
      run: ccache --show-stats

  runtime-and-security:
    name: Runtime and security gate
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.qa_relevant == 'true'
    timeout-minutes: 90
    env:
      CC: ccache cc
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache gitleaks libncurses-dev libtinfo-dev libreadline-dev libarchive-dev libarchive-tools cmark valgrind clang

    - name: Restore ccache
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/.ccache
        key: ${{ runner.os }}-ccache-${{ github.workflow }}-runtime-security-${{ hashFiles('Makefile', '.github/workflows/full-qa.yml') }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ github.workflow }}-runtime-security-
          ${{ runner.os }}-ccache-${{ github.workflow }}-

    - name: Configure compiler cache
      run: |
        ccache --set-config=max_size=900M
        ccache --set-config=sloppiness=time_macros
        ccache --zero-stats

    - name: Run runtime and security gate
      run: |
        set -euo pipefail
        {
          make qa-valgrind
          make qa-fuzz FUZZ_CC="ccache clang"
          make qa-gitleaks
        } 2>&1 | tee qa-runtime-security.log

    - name: Upload runtime and security log artifact
      if: always() && hashFiles('qa-runtime-security.log') != ''
      uses: actions/upload-artifact@v7
      with:
        name: qa-runtime-security-log
        path: qa-runtime-security.log

    - name: Upload valgrind log artifact
      if: always() && hashFiles('valgrind.log') != ''
      uses: actions/upload-artifact@v7
      with:
        name: qa-valgrind-log
        path: valgrind.log

    - name: Report ccache stats
      if: always()
      run: ccache --show-stats

  qa-pytest:
    name: Full pytest gate
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.qa_relevant == 'true'
    timeout-minutes: 90
    env:
      CC: ccache cc
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache libncurses-dev libtinfo-dev libreadline-dev libarchive-dev libarchive-tools cmark

    - name: Restore ccache
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/.ccache
        key: ${{ runner.os }}-ccache-${{ github.workflow }}-pytest-${{ hashFiles('Makefile', '.github/workflows/full-qa.yml') }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ github.workflow }}-pytest-
          ${{ runner.os }}-ccache-${{ github.workflow }}-

    - name: Set up Python 3
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: scripts/requirements.txt

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r scripts/requirements.txt

    - name: Configure compiler cache
      run: |
        ccache --set-config=max_size=900M
        ccache --set-config=sloppiness=time_macros
        ccache --zero-stats

    - name: Run full pytest gate
      run: |
        set -euo pipefail
        make qa-pytest 2>&1 | tee qa-pytest.log

    - name: Upload full pytest log artifact
      if: always() && hashFiles('qa-pytest.log') != ''
      uses: actions/upload-artifact@v7
      with:
        name: qa-pytest-log
        path: qa-pytest.log

    - name: Report ccache stats
      if: always()
      run: ccache --show-stats

  qa-sanitize:
    name: Sanitizer gate
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.qa_relevant == 'true'
    timeout-minutes: 120
    env:
      CC: ccache cc
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}

    steps:
    - uses: actions/checkout@v7

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache libncurses-dev libtinfo-dev libreadline-dev libarchive-dev libarchive-tools cmark clang

    - name: Restore ccache
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/.ccache
        key: ${{ runner.os }}-ccache-${{ github.workflow }}-qa-sanitize-${{ hashFiles('Makefile', '.github/workflows/full-qa.yml') }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ github.workflow }}-qa-sanitize-
          ${{ runner.os }}-ccache-${{ github.workflow }}-

    - name: Set up Python 3
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: scripts/requirements.txt

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r scripts/requirements.txt

    - name: Configure compiler cache
      run: |
        ccache --set-config=max_size=900M
        ccache --set-config=sloppiness=time_macros
        ccache --zero-stats

    - name: Run sanitizer QA gate
      run: make qa-sanitize 2>&1 | tee qa-sanitize.log

    - name: Upload qa-sanitize log artifact
      if: always() && hashFiles('qa-sanitize.log') != ''
      uses: actions/upload-artifact@v7
      with:
        name: qa-sanitize-log
        path: qa-sanitize.log

    - name: Report ccache stats
      if: always()
      run: ccache --show-stats
